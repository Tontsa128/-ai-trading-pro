# Workers Builds runs from this directory; static assets remain in the repository root.
# The Worker is JavaScript-only; Python app dependencies are not needed for this build.
name = "ai-trading-pro"
main = "./worker.mjs"
compatibility_date = "2026-11-11"
preview_urls = true

[assets]
directory = "../public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

