name: Binance historical candle archive

on:
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Target history window for all pairs and timeframes; fills missing older candles"
        required: true
        type: choice
        options: ["365", "540", "730"]
        default: "365"
  schedule:
    - cron: "13 * * * *"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/binance-historical-archive.yml"
      - "scripts/archive_binance_history.py"
      - "scripts/historical-strategy-diagnostics.js"
      - "tests/test_historical_archive.py"
      - "tests/historical-strategy-diagnostics.test.js"
  push:
    branches: [main]
    paths:
      - ".github/workflows/binance-historical-archive.yml"
      - "scripts/archive_binance_history.py"

permissions:
  contents: write

concurrency:
  group: binance-historical-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout application source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js for canonical diagnostics
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Test archive timestamp and CSV logic
        run: python -m unittest discover -s tests -p "test_historical_archive.py" -v

      - name: Compile collector and diagnostics
        run: |
          python -m py_compile scripts/archive_binance_history.py tests/test_historical_archive.py
          node --check scripts/historical-strategy-diagnostics.js

      - name: Restore historical archive branch
        if: github.event_name != 'pull_request'
        run: |
          git fetch origin paper-data
          git worktree add ../paper-data origin/paper-data

      - name: Collect closed Binance Spot candles
        if: github.event_name != 'pull_request'
        env:
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '365' }}
        run: |
          python scripts/archive_binance_history.py --output ../paper-data/historical-data/binance --lookback-days "$LOOKBACK_DAYS"

      - name: Validate archive completeness and monotonic timestamps
        if: github.event_name != 'pull_request'
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          root = Path("../paper-data/historical-data/binance")
          manifest = json.loads((root / "manifest.json").read_text())
          assert manifest["passed"], manifest["failures"]
          for item in manifest["results"]:
              path = root / item["symbol"] / f'{item["interval"]}.csv'
              with path.open(newline="") as f:
                  rows = list(csv.DictReader(f))
              opens = [r["open_time_utc"] for r in rows]
              assert len(opens) == len(set(opens)), f"duplicate candles: {path}"
              assert opens == sorted(opens), f"unsorted candles: {path}"
              assert all(r["available_at_utc"] > r["close_time_utc"] for r in rows)
              assert all(r["collected_at_utc"] for r in rows)
              assert len(rows) >= 220, f"insufficient warm-up history: {path}"
              interval_ms = {"1h": 3600000, "4h": 14400000, "1d": 86400000}[item["interval"]]
              from datetime import datetime
              times = [int(datetime.fromisoformat(x.replace("Z", "+00:00")).timestamp() * 1000) for x in opens]
              assert all(b - a == interval_ms for a, b in zip(times, times[1:])), f"candle gap: {path}"
          assert len(manifest["results"]) == 18, "all 6 symbols x 3 intervals must be archived"
          print("Validated 18 closed-candle CSV archives with >=220 candles and no gaps")
          PY

      - name: Run canonical 1h + 4h + 1d strategy diagnostics
        if: github.event_name != 'pull_request'
        run: |
          node scripts/historical-strategy-diagnostics.js --data-dir ../paper-data/historical-data/binance --output ../paper-data/historical-data/diagnostics/latest.json

      - name: Persist archive and diagnostics to paper-data branch
        if: github.event_name != 'pull_request'
        working-directory: ../paper-data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add historical-data/binance/
          if git diff --cached --quiet; then
            echo "No new closed candles"
          else
            git commit -m "Archive Binance Spot historical candles"
            git pull --rebase origin paper-data
            git push origin HEAD:paper-data
          fi
