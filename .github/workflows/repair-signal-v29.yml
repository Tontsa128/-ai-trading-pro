name: Repair signal engine v29

on:
  push:
    branches: [fix/trading-audit-data-freshness]
    paths:
      - scripts/repair-signal-v29.js
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply signal-engine repair
        run: node scripts/repair-signal-v29.js
      - name: Validate syntax and tests
        run: npm test
      - name: Commit repaired engine
        run: |
          if git diff --quiet; then
            echo "No repair changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trading-engine.js public/trading-engine.js tests/trading-engine.test.js
          git commit -m "Fix overly restrictive long signal gating"
          git push
