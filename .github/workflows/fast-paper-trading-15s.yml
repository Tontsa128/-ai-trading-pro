name: Fast paper trading (15s)

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fast-paper-trading.yml"
      - ".github/workflows/fast-paper-trading-15s.yml"
      - "scripts/fast-paper-trader.js"
      - "scripts/market-feed.js"
      - "scripts/fast-paper-data.js"
      - "tests/fast-paper-data.test.js"
      - "scripts/persist-paper-data.sh"
      - "tests/fast-paper-trader.test.js"
      - "tests/market-feed.test.js"
      - "tests/paper-data-persistence.test.js"
      - "package.json"
  schedule:
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch:
    inputs:
      session_seconds:
        description: "Session length in seconds (max 210)"
        required: true
        type: choice
        options:
          - "60"
          - "120"
          - "180"
          - "210"
        default: "210"

permissions:
  contents: write

concurrency:
  group: fast-paper-trading-15s
  cancel-in-progress: false

jobs:
  fast-paper-15s:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      FAST_INTERVAL_SECONDS: "15"
      FAST_SESSION_SECONDS: ${{ github.event.inputs.session_seconds || '210' }}
    steps:
      - name: Checkout source code from PR head or main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || 'main' }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore 15-second portfolio and report history from paper-data branch
        if: github.event_name != 'pull_request'
        run: |
          git fetch origin +refs/heads/paper-data:refs/remotes/origin/paper-data
          git checkout origin/paper-data -- data/fast-paper-state-15s.json data/fast-paper-latest-15s.json data/fast-reports/15s/
      - name: Test existing trading engine
        run: npm test && node tests/paper-data-persistence.test.js && bash -n scripts/persist-paper-data.sh
      - name: Validate fast worker syntax
        run: node --check scripts/fast-paper-trader.js
      - name: Listen to public market stream and simulate 15-second trades
        if: github.event_name != 'pull_request'
        run: node scripts/fast-paper-trader.js
      - name: Validate 15-second paper report
        if: github.event_name != 'pull_request'
        run: |
          node -e "const s=require('./data/fast-paper-state-15s.json'); const r=require('./data/fast-paper-latest-15s.json'); if(s.mode!=='paper'||r.mode!=='paper'||r.intervalSeconds!==15||!Array.isArray(r.symbols)||!Array.isArray(r.sessionTrades)) process.exit(1); console.log('Validated 15s paper state/report')"
      - name: Persist paper data with retry-safe branch updates
        if: github.event_name != 'pull_request'
        run: bash scripts/persist-paper-data.sh fast-15s
