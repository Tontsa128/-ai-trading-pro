name: Repair mobile chart rendering v2

on:
  push:
    branches: [fix/mobile-chart-render]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-chart-render
          fetch-depth: 0
      - name: Apply mobile fallback
        run: |
          set -euo pipefail
          if grep -q 'Rahasampo mobile chart fallback' public/trading-engine.js; then exit 0; fi
          cat >> public/trading-engine.js <<'EOF'

/* Rahasampo mobile chart fallback */
(function () {
  "use strict";
  if (window.matchMedia && window.matchMedia("(max-width: 850px)").matches) {
    window.Plotly = null;
  }
})();
EOF
      - name: Validate JavaScript
        run: node --check public/trading-engine.js
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/trading-engine.js
          git diff --cached --quiet || (git commit -m "fix: render trading chart reliably on mobile" && git push origin HEAD:fix/mobile-chart-render)
