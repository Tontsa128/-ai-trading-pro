name: Trading engine tests

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply pending signal-engine/UI repairs on branch pushes
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        run: |
          node scripts/repair-signal-v29.js
          node scripts/repair-signal-ui-v29.js
          if git diff --quiet; then
            echo "Signal engine/UI already repaired"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add trading-engine.js public/trading-engine.js public/index.html tests/trading-engine.test.js
            git commit -m "Fix signal gating and live diagnostics"
            git push
          fi
      - run: python -m py_compile app.py
      - run: npm test && node tests/paper-data-persistence.test.js && bash -n scripts/persist-paper-data.sh
