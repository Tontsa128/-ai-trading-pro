name: Trading engine tests

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: python -m py_compile app.py
      - run: npm test && node tests/paper-data-persistence.test.js && bash -n scripts/persist-paper-data.sh
