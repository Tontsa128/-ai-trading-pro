name: Repair mobile chart rendering

on:
  push:
    branches:
      - fix/mobile-chart-render

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: fix/mobile-chart-render
          fetch-depth: 0

      - name: Apply mobile chart fallback
        shell: bash
        run: |
          set -euo pipefail
          marker='Rahasampo mobile chart fallback'
          if grep -q "$marker" public/trading-engine.js; then
            echo "Mobile chart fallback already present."
            exit 0
          fi
          cat >> public/trading-engine.js <<'EOF'

/* Rahasampo mobile chart fallback
   Mobile browsers can load Plotly but still fail to paint the WebGL/SVG chart.
   The page already contains a dependency-free SVG renderer; disable Plotly on
   small screens before renderChart() runs so that renderer is selected. */
(function () {
  "use strict";
  if (window.matchMedia && window.matchMedia("(max-width: 850px)").matches) {
    window.Plotly = null;
  }
})();
EOF

      - name: Verify JavaScript syntax
        shell: bash
        run: node --check public/trading-engine.js

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/trading-engine.js
          git diff --cached --quiet && exit 0
          git commit -m "fix: render trading chart reliably on mobile"
          git push origin HEAD:fix/mobile-chart-render
