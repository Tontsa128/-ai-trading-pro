name: Fast paper trading (5s / 15s)

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fast-paper-trading.yml"
      - ".github/workflows/fast-paper-trading-15s.yml"
      - "scripts/fast-paper-trader.js"
      - "scripts/market-feed.js"
      - "scripts/fast-paper-data.js"
      - "tests/fast-paper-data.test.js"
      - "scripts/persist-paper-data.sh"
      - "tests/fast-paper-trader.test.js"
      - "tests/market-feed.test.js"
      - "tests/paper-data-persistence.test.js"
      - "package.json"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      interval_seconds:
        description: "Paper signal candle size"
        required: true
        type: choice
        options:
          - "5"
        default: "5"
      session_seconds:
        description: "How long to listen (seconds; max 210)"
        required: true
        type: choice
        options:
          - "60"
          - "120"
          - "180"
          - "210"
        default: "210"

permissions:
  contents: write

concurrency:
  group: fast-paper-trading-5s
  cancel-in-progress: false

jobs:
  fast-paper:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      FAST_INTERVAL_SECONDS: ${{ github.event.inputs.interval_seconds || '5' }}
      FAST_SESSION_SECONDS: ${{ github.event.inputs.session_seconds || '210' }}
    steps:
      - name: Checkout source code from PR head or main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || 'main' }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Python for historical archive regression tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test historical archive timestamp and CSV logic
        run: python -m unittest discover -s tests -p "test_historical_archive.py" -v
      - name: Restore 5-second portfolio and report history from paper-data branch
        if: github.event_name != 'pull_request'
        run: |
          git fetch origin +refs/heads/paper-data:refs/remotes/origin/paper-data
          git checkout origin/paper-data -- data/fast-paper-state-5s.json data/fast-paper-latest-5s.json data/fast-reports/5s/
      - name: Test existing trading engine
        run: npm test && node tests/paper-data-persistence.test.js && bash -n scripts/persist-paper-data.sh
      - name: Validate fast worker syntax
        run: node --check scripts/fast-paper-trader.js
      - name: Run isolated live Binance paper diagnostics (PR only)
        if: github.event_name == 'pull_request'
        env:
          FAST_INTERVAL_SECONDS: "5"
          FAST_SESSION_SECONDS: "60"
        run: node scripts/fast-paper-trader.js
      - name: Validate PR paper diagnostics report
        if: github.event_name == 'pull_request'
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('data/fast-paper-latest-5s.json', 'utf8'));
          if (report.mode !== 'paper' || report.intervalSeconds !== 5) throw new Error('Invalid PR paper report identity');
          if (!report.signalDiagnostics || !Array.isArray(report.sessionTrades)) throw new Error('Missing live signal diagnostics');
          for (const symbol of ['BTCUSDT','ETHUSDT','SOLUSDT','BNBUSDT','XRPUSDT','DOGEUSDT']) {
            const d = report.signalDiagnostics[symbol];
            if (!d || !Number.isInteger(d.closedBars) || !Number.isInteger(d.insufficientHistory) ||
                !Number.isInteger(d.crossUp) || !Number.isInteger(d.momentumFailed) ||
                !Number.isInteger(d.spreadTooWide) || !Number.isInteger(d.entriesOpened)) {
              throw new Error('Incomplete signal gate counters for ' + symbol);
            }
          }
          console.log('Validated isolated live Binance paper diagnostics for all six symbols');
          NODE
      - name: Listen to public market stream and simulate trades
        if: github.event_name != 'pull_request'
        run: node scripts/fast-paper-trader.js
      - name: Validate fast paper report
        if: github.event_name != 'pull_request'
        run: |
          node -e "const i=process.env.FAST_INTERVAL_SECONDS||'5'; const s=require('./data/fast-paper-state-'+i+'s.json'); const r=require('./data/fast-paper-latest-'+i+'s.json'); if(s.mode!=='paper'||r.mode!=='paper'||r.intervalSeconds!==Number(i)||!Array.isArray(r.symbols)||!Array.isArray(r.sessionTrades)) process.exit(1); console.log('Validated '+i+'s paper state/report')"
      - name: Persist paper data with retry-safe branch updates
        if: github.event_name != 'pull_request'
        run: bash scripts/persist-paper-data.sh fast-5s
